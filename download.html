<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Export Download</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 500px; }
    .box p { font-size: 1.1rem; margin-bottom: 1.5rem; }
    .box .sub { color: #888; font-size: 0.85rem; margin-top: 1rem; }
    .dl-btn { display: inline-block; padding: 14px 32px; font-size: 1.1rem; font-weight: 600;
              color: #fff; background: #22c55e; border: none; border-radius: 8px;
              cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .dl-btn:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="box">
    <p id="msg">Your file is ready</p>
    <button id="dlBtn" class="dl-btn" style="display:none"></button>
    <p class="sub" id="sub"></p>
  </div>
  <script>
    (function () {
      var msgEl = document.getElementById("msg");
      var subEl = document.getElementById("sub");
      var btnEl = document.getElementById("dlBtn");
      var fileName = "";

      try {
        var key = location.hash.substring(1);
        if (!key) { msgEl.textContent = "No export data found."; return; }

        var store = window.opener && window.opener._xlsxDownload;
        var payload = store && store[key];
        if (!payload) { msgEl.textContent = "Export data not found or expired. Please try again."; return; }

        fileName = payload.filename;
        var b64 = payload.b64;
        var srcUrl = payload.url;

        // Clean up from opener
        try { delete window.opener._xlsxDownload[key]; } catch (e) {}

        // Clear hash for privacy
        history.replaceState(null, "", location.pathname);

        // Two ways the bytes arrive. Base64 is what the Excel exports hand
        // over: they build the file in the opener and it is small. A URL is
        // what a GDPR export hands over: the file already exists on a signed
        // Genesys download link, is fetched here directly so the app's proxy
        // never has to carry binary, and can be large. Either way it ends up
        // as a Blob and goes through the same Save button, because that button
        // — showSaveFilePicker, the native Save As dialog — is the one thing
        // that works from inside the sandboxed popup the app lives in;
        // navigating any tab the app opened to a download URL does nothing.
        var ext = fileName.split(".").pop().toLowerCase();
        if (srcUrl) {
          msgEl.textContent = "Fetching your export…";
          subEl.textContent = "Large exports can take a moment.";
          fetch(srcUrl, { mode: "cors", credentials: "omit" })
            .then(function (resp) {
              if (!resp.ok) throw new Error("HTTP " + resp.status);
              return resp.blob();
            })
            .then(function (fetched) {
              offer(fetched.type && fetched.type !== "application/octet-stream"
                ? fetched
                : new Blob([fetched], { type: mimeFor(ext) }));
            })
            .catch(function (e) {
              // Most likely the signed host does not allow a cross-origin
              // fetch. The link still works from a tab the BROWSER opens —
              // right-click, "Open link in new tab" — so offer exactly that.
              msgEl.textContent = "Could not fetch the export into this tab.";
              var a = document.createElement("a");
              a.href = srcUrl;
              a.textContent = "Right-click here and choose “Open link in new tab” to download it";
              a.style.cssText = "color:#93c5fd;font-size:1rem";
              a.addEventListener("click", function (ev) {
                // A left-click here would just repeat the blank-tab failure.
                ev.preventDefault();
                subEl.textContent = "Left-clicking will not work from this tab — right-click the link and open it in a new tab.";
              });
              subEl.textContent = "";
              subEl.appendChild(document.createTextNode("(" + (e.message || "fetch failed") + ") "));
              subEl.appendChild(a);
              console.warn("Download helper: fetch of signed URL failed", e);
            });
          return;
        }

        // Decode base64
        var raw = atob(b64);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        offer(new Blob([bytes], { type: mimeFor(ext) }));
      } catch (err) {
        msgEl.textContent = "Error: " + err.message;
        console.error("Download helper error:", err);
      }

      function mimeFor(ext) {
        var mimeMap = {
          xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          zip:  "application/zip",
          csv:  "text/csv",
          pdf:  "application/pdf",
          svg:  "image/svg+xml",
          png:  "image/png",
          html: "text/html",
          json: "application/json",
        };
        return mimeMap[ext] || "application/octet-stream";
      }

      function offer(blob) {
        var ext = fileName.split(".").pop().toLowerCase();
        var mime = blob.type || mimeFor(ext);
        var descMap = {
          xlsx: "Excel Workbook", zip: "ZIP Archive", csv: "CSV File", pdf: "PDF Document",
          svg: "SVG Image", png: "PNG Image", html: "HTML Page", json: "JSON File",
        };

        // File picker accepts config per extension
        var pickerTypes = [{
          description: descMap[ext] || "File",
          accept: {},
        }];
        pickerTypes[0].accept[mime] = ["." + ext];

        msgEl.textContent = "Click the button to save your file:";
        btnEl.textContent = "\u2B07 Save " + fileName;
        btnEl.style.display = "inline-block";
        subEl.textContent = "You can close this tab after downloading.";

        btnEl.addEventListener("click", async function () {
          try {
            // Primary: File System Access API (native Save As dialog)
            if (window.showSaveFilePicker) {
              var handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: pickerTypes,
              });
              var writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              msgEl.textContent = "\u2705 Saved: " + fileName;
              btnEl.style.display = "none";
              var countdown = 3;
              subEl.textContent = "Closing in " + countdown + "s\u2026";
              var timer = setInterval(function () {
                countdown--;
                if (countdown <= 0) { clearInterval(timer); window.close(); }
                else { subEl.textContent = "Closing in " + countdown + "s\u2026"; }
              }, 1000);
              return;
            }
          } catch (e) {
            if (e.name === "AbortError") { return; } // user cancelled
            console.warn("showSaveFilePicker failed, trying fallback:", e);
          }

          // Fallback: blob URL <a> click
          try {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            msgEl.textContent = "Download started: " + fileName;
          } catch (e2) {
            msgEl.textContent = "Download failed: " + e2.message;
          }
        });
      }
    })();
  </script>
</body>
</html>
